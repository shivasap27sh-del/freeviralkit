<svg width="32" height="32" viewBox="0 0 32 32" xmlns="https://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="wing-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#f9a8d4" />
    </linearGradient>
    <linearGradient id="wing-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)" />
  <!-- Top wings -->
  <ellipse cx="11.5" cy="12.5" rx="4.5" ry="6.5" transform="rotate(-25 11.5 12.5)" fill="url(#wing-top)" opacity="0.95" />
  <ellipse cx="20.5" cy="12.5" rx="4.5" ry="6.5" transform="rotate(25 20.5 12.5)" fill="url(#wing-top)" opacity="0.95" />
  <!-- Bottom wings -->
  <ellipse cx="13" cy="20" rx="3.2" ry="4.5" transform="rotate(-12 13 20)" fill="url(#wing-bot)" opacity="0.85" />
  <ellipse cx="19" cy="20" rx="3.2" ry="4.5" transform="rotate(12 19 20)" fill="url(#wing-bot)" opacity="0.85" />
  <!-- Body -->
  <ellipse cx="16" cy="16" rx="1" ry="5" fill="white" opacity="0.9" />
  <!-- Antennae -->
  <path d="M16 11 Q14 8 12.5 7" fill="none" stroke="white" stroke-width="0.6" stroke-linecap="round" opacity="0.6" />
  <path d="M16 11 Q18 8 19.5 7" fill="none" stroke="white" stroke-width="0.6" stroke-linecap="round" opacity="0.6" />
  <circle cx="12.2" cy="6.8" r="0.7" fill="white" opacity="0.5" />
  <circle cx="19.8" cy="6.8" r="0.7" fill="white" opacity="0.5" />
</svg>
